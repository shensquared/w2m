# nginx server block for w2m-mcp.shenshen.mit.edu.
# Install: sudo cp deploy/nginx-w2m-mcp.conf /etc/nginx/sites-available/w2m-mcp
#          sudo ln -s /etc/nginx/sites-available/w2m-mcp /etc/nginx/sites-enabled/w2m-mcp
#          sudo nginx -t && sudo systemctl reload nginx
# The certificate paths assume `certbot certonly --nginx -d w2m-mcp.shenshen.mit.edu` ran first.

server {
    listen 80;
    listen [::]:80;
    server_name w2m-mcp.shenshen.mit.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name w2m-mcp.shenshen.mit.edu;

    ssl_certificate /etc/letsencrypt/live/w2m-mcp.shenshen.mit.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/w2m-mcp.shenshen.mit.edu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Everything goes to the app: /mcp, the OAuth routes (/authorize, /token,
    # /register, /auth/callback, /consent) and the /.well-known/ discovery documents.
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streamable HTTP keeps SSE responses open; do not buffer or time them out early.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
